<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>CSDN + Gitee 个人详情 · v13</title>
  <style>
    /* Ma: v10 - 个人详情页 (Kami 风格) */
    :root {
      --parchment: #f5f4ed;
      --ivory: #faf9f5;
      --near-black: #141413;
      --dark-warm: #3d3d3a;
      --olive: #504e49;
      --stone: #6b6a64;
      --brand: #1B365D;
      --brand-soft: #E4ECF5;
      --brand-deeper: #0e223d;
      --accent: #c44d36;
      --accent-soft: #faf3ee;
      --border: #e8e6dc;
      --border-soft: #e5e3d8;
      --warn-bg: #fff7e0;
      --warn-border: #e9c772;
      --warn-fg: #8b6914;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--parchment);
      color: var(--near-black);
      font-family: "Source Han Serif SC", "Noto Serif SC", "Songti SC", "STSong", "SimSun", Georgia, serif;
      line-height: 1.6;
      padding: 0 0 60px 0;
      max-width: 1200px;
      margin: 0 auto;
    }
    /* nav */
    .topnav {
      background: var(--ivory);
      border-bottom: 0.6pt solid var(--border);
      padding: 14px 24px;
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      font-size: 14px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(6px);
    }
    .topnav .brand { font-weight: 600; color: var(--brand); margin-right: 12px; }
    .topnav a.tab {
      color: var(--olive);
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 2px;
      border: 0.6pt solid transparent;
      transition: all 0.15s;
    }
    .topnav a.tab:hover { background: var(--brand-soft); color: var(--brand); }
    .topnav a.tab.active {
      background: var(--brand);
      color: var(--ivory);
      border-color: var(--brand);
    }
    .topnav .ver {
      margin-left: auto;
      font-family: ui-monospace, monospace;
      font-size: 11px;
      color: var(--stone);
      letter-spacing: 0.04em;
    }

    main { padding: 28px 24px 0 24px; }

    /* 头部 */
    .student-head {
      background: var(--ivory);
      border: 0.6pt solid var(--border);
      border-radius: 4px;
      padding: 24px 28px;
      display: flex;
      gap: 22px;
      align-items: flex-start;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }
    .avatar {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-deeper) 100%);
      color: var(--ivory);
      font-size: 32px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      letter-spacing: 0.02em;
    }
    .head-info { flex: 1 1 280px; min-width: 0; }
    .head-info h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .head-info .meta-line {
      font-size: 13px;
      color: var(--olive);
      margin-bottom: 4px;
    }
    .head-info .meta-line code {
      font-family: ui-monospace, monospace;
      background: var(--brand-soft);
      color: var(--brand);
      padding: 2px 8px;
      border-radius: 2px;
      font-size: 12px;
    }
    .head-cta {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
    }
    .btn-csdn {
      display: inline-block;
      background: var(--brand);
      color: var(--ivory);
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 2px;
      font-size: 14px;
      transition: background 0.15s;
      border: 0.6pt solid var(--brand);
    }
    .btn-csdn:hover { background: var(--brand-deeper); }
    .btn-csdn[disabled] { background: var(--stone); border-color: var(--stone); cursor: not-allowed; }

    /* v10: Gitee 卡片样式 */
    .gitee-card-detail {
      background: var(--ivory);
      border: 0.6pt solid var(--border);
      border-radius: 2px;
      padding: 18px 22px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 18px;
      align-items: center;
      margin-bottom: 24px;
    }
    .gitee-card-detail .gitee-ico {
      font-size: 32px;
      color: var(--brand);
      width: 56px; height: 56px;
      display: flex; align-items: center; justify-content: center;
      background: var(--brand-soft);
      border-radius: 2px;
    }
    .gitee-card-detail .gitee-info { flex: 1; }
    .gitee-card-detail .gitee-info h3 {
      font-size: 17px;
      color: var(--brand);
      font-weight: 600;
      margin-bottom: 4px;
    }
    .gitee-card-detail .gitee-info .repo {
      font-family: ui-monospace, monospace;
      font-size: 12px;
      color: var(--stone);
      margin-bottom: 6px;
    }
    .gitee-card-detail .gitee-info .stats {
      display: flex;
      gap: 14px;
      font-size: 13px;
      color: var(--olive);
      flex-wrap: wrap;
    }
    .gitee-card-detail .gitee-info .stats strong {
      color: var(--brand);
      font-weight: 600;
      font-size: 16px;
      margin-right: 4px;
    }
    .gitee-card-detail .gitee-info .msg {
      font-size: 12px;
      color: var(--stone);
      margin-top: 6px;
      font-style: italic;
    }
    .gitee-card-detail .gitee-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
    }
    .gitee-card-detail .gitee-actions a {
      background: var(--brand);
      color: var(--ivory);
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 2px;
      font-size: 13px;
      border: 0.6pt solid var(--brand);
    }
    .gitee-card-detail .gitee-actions a:hover { background: var(--brand-deeper); }
    .gitee-card-detail.fail { border-color: var(--accent); background: var(--accent-soft); }
    .gitee-card-detail.fail .gitee-ico { background: var(--accent); color: var(--ivory); }
    .gitee-card-detail.empty { text-align: center; padding: 24px; color: var(--stone); }
    /* Ma v11: Gitee empty vs fail 区分 (学生刚建 vs 抓取失败) */
    .gitee-card-detail.empty-repo { border-color: #fbbf24; background: #fef3c7; color: #92400e; }
    .gitee-card-detail.empty-repo .gitee-ico { background: #fbbf24; color: white; }
    .head-stats {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .head-stat { font-size: 13px; color: var(--olive); }
    .head-stat strong {
      display: block;
      font-size: 22px;
      color: var(--brand);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    /* section */
    .section { margin-bottom: 32px; }
    .section-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 0.6pt solid var(--border);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }
    .section-title .hint { font-size: 12px; color: var(--stone); font-weight: 400; }

    /* 时间轴 SVG */
    .trend-wrap {
      background: var(--ivory);
      border: 0.6pt solid var(--border);
      border-radius: 2px;
      padding: 18px;
    }
    .trend-svg { width: 100%; height: 200px; display: block; }
    .trend-svg .axis line { stroke: var(--border); stroke-width: 0.6; }
    .trend-svg .axis text { fill: var(--stone); font-size: 10px; font-family: ui-monospace, monospace; }
    .trend-svg .grid line { stroke: var(--border-soft); stroke-width: 0.4; stroke-dasharray: 2 3; }
    .trend-svg .line { fill: none; stroke: var(--brand); stroke-width: 2; }
    .trend-svg .area { fill: rgba(27, 54, 93, 0.08); }
    .trend-svg .pt { fill: var(--brand); }
    .trend-svg .pt-label { fill: var(--near-black); font-size: 10px; font-family: ui-monospace, monospace; }
    .trend-empty {
      background: var(--accent-soft);
      border-left: 3px solid var(--accent);
      padding: 14px 18px;
      border-radius: 2px;
      color: var(--accent);
      font-size: 13px;
    }
    .trend-empty strong { color: var(--near-black); }

    /* heatmap */
    .heat-wrap {
      background: var(--ivory);
      border: 0.6pt solid var(--border);
      border-radius: 2px;
      padding: 18px;
      overflow-x: auto;
    }
    .heat-grid {
      display: grid;
      grid-template-rows: repeat(7, 1fr);
      grid-auto-flow: column;
      grid-auto-columns: 14px;
      gap: 3px;
      margin: 10px 0 6px 24px;
    }
    .heat-cell {
      width: 14px; height: 14px;
      background: var(--border-soft);
      border-radius: 2px;
      cursor: default;
      transition: all 0.12s;
    }
    .heat-cell:hover { outline: 1.5px solid var(--near-black); }
    .heat-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--stone);
      margin-top: 6px;
      font-family: ui-monospace, monospace;
    }
    .heat-week {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      margin-right: 4px;
      font-size: 9px;
      color: var(--stone);
      font-family: ui-monospace, monospace;
    }
    .heat-meta {
      display: flex;
      gap: 14px;
      font-size: 11px;
      color: var(--stone);
      margin-top: 8px;
      align-items: center;
    }
    .heat-meta .swatch {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 2px;
      vertical-align: middle;
      margin-right: 4px;
    }

    /* 文章表格 */
    table.posts {
      width: 100%;
      border-collapse: collapse;
      background: var(--ivory);
      border: 0.6pt solid var(--border);
      border-radius: 2px;
      overflow: hidden;
      font-size: 13px;
    }
    table.posts th, table.posts td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 0.6pt solid var(--border-soft);
    }
    table.posts th {
      background: var(--brand-soft);
      color: var(--brand);
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    table.posts tr:last-child td { border-bottom: none; }
    table.posts .ttl a {
      color: var(--brand);
      text-decoration: none;
    }
    table.posts .ttl a:hover { text-decoration: underline; }
    table.posts .num { font-variant-numeric: tabular-nums; text-align: right; color: var(--olive); }
    table.posts .num.read { color: var(--brand); font-weight: 600; }
    table.posts .ts { font-family: ui-monospace, monospace; font-size: 11px; color: var(--stone); }
    .empty-state {
      background: var(--ivory);
      border: 0.6pt dashed var(--border);
      padding: 32px;
      text-align: center;
      color: var(--stone);
      border-radius: 2px;
      font-size: 13px;
    }
    .err-state {
      background: #faf3ee;
      border-left: 3px solid var(--accent);
      padding: 18px;
      color: var(--accent);
      border-radius: 2px;
      font-size: 14px;
    }

    @media (max-width: 720px) {
      .topnav { padding: 12px 16px; }
      main { padding: 20px 16px 0 16px; }
      .student-head { padding: 18px; }
      .head-info h1 { font-size: 22px; }
      .avatar { width: 64px; height: 64px; font-size: 26px; }
    }
  /* v21: 暗色模式 — Ma 晚上看 dashboard */
    html.dark {
    --parchment: #1a1a1f;
    --ivory: #25252b;
    --near-black: #e8e6dc;
    --dark-warm: #c4c2ba;
    --olive: #a8a59e;
    --stone: #807d75;
    --brand: #6B8FBD;
    --brand-soft: #2a3a52;
    --accent: #e87658;
    --accent-soft: #3a2620;
    --border: #3d3d44;
    --border-soft: #30303a;
    --tag-bg: #2a3a52;
    --new-bg: #3a2a18;
    --new-fg: #e89968;
    }
    html.dark body { background: var(--parchment); color: var(--near-black); }
    html.dark .stat,
    html.dark .fetch-meta-panel,
    html.dark .gitee-card,
    html.dark .gitee-card-detail { background: var(--ivory); border-color: var(--border); }
    html.dark .student { background: var(--ivory); border-color: var(--border); }
    html.dark .student:hover { border-color: var(--brand); box-shadow: 0 6px 20px rgba(107, 143, 189, 0.18); }
    html.dark .topnav { background: var(--ivory); border-bottom-color: var(--border); }
    html.dark .topnav a.tab.active { background: var(--brand); color: var(--ivory); }
    html.dark .toolbar input, html.dark .toolbar select,
    html.dark .toolbar .refresh-btn {
    background: var(--ivory); color: var(--near-black); border-color: var(--border);
    }
    html.dark .latest-section { border-top-color: var(--border-soft); }
    html.dark .gitee-mini { border-top-color: var(--border-soft); }
    html.dark .latest-post-date { background: var(--border-soft); color: var(--olive); }
    html.dark .post-count.zero { background: var(--border-soft); color: var(--stone); }
    html.dark .fetch-meta-toggle { background: var(--ivory); }
    /* 暗色 toggle 按钮 */
    .dark-toggle {
    background: transparent;
    border: 0.6pt solid var(--border);
    color: var(--olive);
    padding: 6px 10px;
    border-radius: 2px;
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    transition: all 0.15s;
    }
    .dark-toggle:hover { background: var(--brand-soft); color: var(--brand); border-color: var(--brand); }
    
  </style>
</head>
<body>

<nav class="topnav">
  <span class="brand">📚 CSDN 监控</span>
  <a class="tab" href="index.html">学生列表</a>
  <a class="tab" href="analytics.html">班级分析</a>
  <a class="tab" href="ranking.html">学生排名</a>
  <a class="tab active" id="nav-active">个人详情</a>
  <button id="dark-toggle" class="dark-toggle" type="button" aria-label="切换暗色模式">🌙</button><span class="ver">v10.0 · STUDENT-DETAIL</span>
</nav>

<main>
  <div id="root">
    <div class="empty-state">加载中…</div>
  </div>
</main>

<script>
// Ma: v8 - 个人详情页
const VERSION = 'v8.0-student';
const NAME = new URLSearchParams(location.search).get('name') || '';

function fmt(n) { return (n == null || isNaN(n)) ? '—' : Number(n).toLocaleString('en-US'); }
function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]);
}

async function loadAll() {
  try {
    // 1) load main data.json
    const r = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
    const DATA = await r.json();
    const stu = (DATA.students || []).find(s => s.name === NAME);

    // 2) load history snapshots (尝试 history-test/ 优先, history/ 其次)
    let history = await loadHistory();

    render(stu, history, DATA.last_update);
  } catch (e) {
    document.getElementById('root').innerHTML =
      `<div class="err-state">❌ 加载失败: ${escapeHtml(e.message)}</div>`;
  }
}

async function loadHistory() {
  // Ma: 优先尝试 history-test/ (开发期), 失败回退 history/
  const tries = ['history-test', 'history'];
  for (const dir of tries) {
    try {
      const idx = await fetch(`${dir}/_index.json?t=${Date.now()}`, { cache: 'no-store' });
      if (idx.ok) {
        const arr = await idx.json();
        return arr;
      }
    } catch (e) {}
  }
  // 没 _index.json - 直接尝试已知文件名
  return [];
}

function render(stu, history, lastUpdate) {
  const root = document.getElementById('root');

  if (!stu) {
    root.innerHTML = `<div class="err-state">
      ❌ 未找到学生 <code>${escapeHtml(NAME)}</code> · <a href="index.html" style="color:var(--brand);">返回列表</a>
    </div>`;
    return;
  }

  // 更新 nav active 文字
  document.getElementById('nav-active').textContent = `${stu.name || ''} · 个人详情`;

  // 1) 头
  const initials = (stu.name || '').slice(0, 1) || '?';
  const csdn = stu.csdn_url;
  const headHtml = `
    <div class="student-head">
      <div class="avatar">${escapeHtml(initials)}</div>
      <div class="head-info">
        <h1>${escapeHtml(stu.name || '')}</h1>
        <div class="meta-line">CSDN · <code>${escapeHtml(stu.csdn_username || '未配置')}</code></div>
        <div class="meta-line">最近抓取 · ${escapeHtml(lastUpdate || '—')}</div>
        <div class="head-stats">
          <div class="head-stat"><strong>${fmt(stu.post_count || 0)}</strong>文章数</div>
          <div class="head-stat"><strong>${fmt(stu.total_views || 0)}</strong>总阅读</div>
          <div class="head-stat"><strong>${fmt((stu.total_likes || 0) + (stu.total_comments || 0) + (stu.total_collections || 0))}</strong>互动</div>
          <div class="head-stat"><strong>${stu.post_count ? fmt(Math.round((stu.total_views || 0) / stu.post_count)) : '—'}</strong>平均阅读/篇</div>
        </div>
      </div>
      <div class="head-cta">
        ${csdn ? `<a class="btn-csdn" href="${escapeHtml(csdn)}" target="_blank" rel="noopener">访问 CSDN 主页 ↗</a>` : '<span class="btn-csdn" disabled>未配置 CSDN</span>'}
        <a class="btn-csdn" href="analytics.html" style="background:var(--ivory);color:var(--brand);">← 返回班级分析</a>
      </div>
    </div>
  `;

  // 2) 时间轴
  const trendHtml = renderTrend(history, stu);

  // 3) 热力图
  const heatHtml = renderHeat(stu);

  // 4) 文章详细
  const postsHtml = renderPosts(stu);

  // v10: Gitee 仓库卡片
  const giteeHtml = renderGitee(stu);

  root.innerHTML = `
    ${headHtml}
    ${giteeHtml}
    <section class="section">
      <div class="section-title">
        <span>📈 个人发文时间轴</span>
        <span class="hint">按历史快照 · ≥2 天画趋势</span>
      </div>
      ${trendHtml}
    </section>
    <section class="section">
      <div class="section-title">
        <span>🗓 发文日历热力图</span>
        <span class="hint">最近 12 周 · 颜色越深发文越多</span>
      </div>
      ${heatHtml}
    </section>
    <section class="section">
      <div class="section-title">
        <span>📝 文章详细</span>
        <span class="hint">按 total_views 降序</span>
      </div>
      ${postsHtml}
    </section>
  `;
}

// v10: Gitee 仓库卡片
function renderGitee(stu) {
  const g = stu.gitee;
  if (!g || !g.url) {
    return `<div class="gitee-card-detail empty">未配置 Gitee 仓库</div>`;
  }
  if (g.ok) {
    const dateStr = g.date ? g.date.slice(0, 10) : '—';
    const shaShort = g.sha ? `<code style="font-size:11px;background:var(--brand-soft);color:var(--brand);padding:1px 5px;border-radius:2px;">${escapeHtml(g.sha)}</code>` : '';
    return `<div class="gitee-card-detail">
      <div class="gitee-ico">💾</div>
      <div class="gitee-info">
        <h3>Gitee 仓库</h3>
        <div class="repo">${escapeHtml(g.owner + '/' + g.repo)} · 抓取自 <code>${escapeHtml(g.source || '?')}</code></div>
        <div class="stats">
          <span><strong>${fmt(g.commit_count || 0)}</strong>commit</span>
          <span><strong>${fmt(g.stars || 0)}</strong>⭐ star</span>
          <span><strong>${fmt(g.forks || 0)}</strong>🍴 fork</span>
          <span style="color:var(--stone);">最后 commit ${escapeHtml(dateStr)} ${shaShort}</span>
        </div>
        ${g.msg ? `<div class="msg">"${escapeHtml(g.msg)}"</div>` : ''}
      </div>
      <div class="gitee-actions">
        <a href="${escapeHtml(g.url)}" target="_blank" rel="noopener">访问仓库 ↗</a>
        <a href="analytics.html" style="background:var(--ivory);color:var(--brand);">← 返回班级分析</a>
      </div>
    </div>`;
  }
  // Ma v11: 区分 empty 仓库 vs 抓取失败
  if (g.status === 'empty') {
    return `<div class="gitee-card-detail empty-repo">
      <div class="gitee-ico">📭</div>
      <div class="gitee-info">
        <h3 style="color:#92400e;">Gitee 仓库存在, 但还没有 commit</h3>
        <div class="repo">${escapeHtml(g.owner + '/' + g.repo)} · 仓库刚创建, 等学生 push 代码后会显示 commit</div>
        <div class="msg" style="color:#92400e;">提示: 学生需要在仓库里至少 commit 一次 (git commit) 然后 push</div>
      </div>
      <div class="gitee-actions">
        <a href="${escapeHtml(g.url)}" target="_blank" rel="noopener" style="background:#92400e;">访问空仓库 ↗</a>
        <a href="analytics.html" style="background:var(--ivory);color:var(--brand);">← 返回班级分析</a>
      </div>
    </div>`;
  }
  return `<div class="gitee-card-detail fail">
    <div class="gitee-ico">⚠️</div>
    <div class="gitee-info">
      <h3 style="color:var(--accent);">Gitee 抓取失败</h3>
      <div class="repo">${escapeHtml((g.owner||'?') + '/' + (g.repo||'?'))} · ${escapeHtml(g.source || 'all sources failed')}</div>
      <div class="msg">${escapeHtml(g.err || '未知错误 - 可能 Gitee 限流或仓库不可访问')}</div>
    </div>
    <div class="gitee-actions">
      <a href="${escapeHtml(g.url)}" target="_blank" rel="noopener">直接打开 ↗</a>
    </div>
  </div>`;
}

function renderTrend(history, stu) {
  // history: [{date: '2026-09-13', students: {...}}, ...] - 排序
  if (!history || history.length === 0) {
    return `<div class="trend-empty"><strong>暂无历史数据</strong><br>
      请先在 <code>csdn-monitor.py</code> 跑几天, 或将示例文件放入 <code>history-test/</code></div>`;
  }
  if (history.length === 1) {
    return `<div class="trend-empty"><strong>只有 1 天数据</strong><br>
      需要 2+ 天数据才能显示趋势 · 当前: <code>${escapeHtml(history[0].date)}</code></div>`;
  }

  // 排序
  const series = history.slice().sort((a, b) => a.date.localeCompare(b.date));
  // 取每个 snapshot 中该 sid 的 post_count
  const data = series.map(s => ({
    date: s.date,
    posts: (s.students && s.students[stu.sid] && s.students[stu.sid].posts)
      ? s.students[stu.sid].posts.length
      : 0
  }));

  const W = 760, H = 200, PAD = { l: 36, r: 16, t: 16, b: 28 };
  const maxY = Math.max(2, ...data.map(d => d.posts));
  const xStep = (W - PAD.l - PAD.r) / Math.max(1, data.length - 1);
  const xOf = i => PAD.l + i * xStep;
  const yOf = v => H - PAD.b - (v / maxY) * (H - PAD.t - PAD.b);

  let path = data.map((d, i) => `${i === 0 ? 'M' : 'L'} ${xOf(i)} ${yOf(d.posts)}`).join(' ');
  let area = path + ` L ${xOf(data.length - 1)} ${H - PAD.b} L ${xOf(0)} ${H - PAD.b} Z`;

  let svg = `<svg class="trend-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;
  // grid
  svg += '<g class="grid">';
  for (let i = 0; i <= 4; i++) {
    const y = PAD.t + (H - PAD.t - PAD.b) * (i / 4);
    svg += `<line x1="${PAD.l}" y1="${y}" x2="${W - PAD.r}" y2="${y}" />`;
  }
  svg += '</g>';
  // axes
  svg += '<g class="axis">';
  svg += `<line x1="${PAD.l}" y1="${H - PAD.b}" x2="${W - PAD.r}" y2="${H - PAD.b}" />`;
  svg += `<line x1="${PAD.l}" y1="${PAD.t}" x2="${PAD.l}" y2="${H - PAD.b}" />`;
  for (let i = 0; i <= 4; i++) {
    const yv = Math.round(maxY * (i / 4));
    const y = yOf(yv);
    svg += `<text x="${PAD.l - 8}" y="${y + 3}" text-anchor="end">${yv}</text>`;
  }
  // x labels
  data.forEach((d, i) => {
    const x = xOf(i);
    if (i % Math.max(1, Math.floor(data.length / 6)) === 0 || i === data.length - 1) {
      svg += `<text x="${x}" y="${H - PAD.b + 14}" text-anchor="middle">${escapeHtml(d.date.slice(5))}</text>`;
    }
  });
  svg += '</g>';
  // area + line
  svg += `<path class="area" d="${area}" />`;
  svg += `<path class="line" d="${path}" />`;
  // points + labels
  data.forEach((d, i) => {
    const x = xOf(i), y = yOf(d.posts);
    svg += `<circle class="pt" cx="${x}" cy="${y}" r="3.5" />`;
    if (d.posts > 0) {
      svg += `<text class="pt-label" x="${x}" y="${y - 8}" text-anchor="middle">${d.posts}</text>`;
    }
  });
  svg += '</svg>';

  return `<div class="trend-wrap">${svg}<div class="meta" style="margin-top:6px;font-size:11px;color:var(--stone);">
    共 ${data.length} 天数据 · 最近: ${escapeHtml(data[data.length - 1].date)}
  </div></div>`;
}

function renderHeat(stu) {
  // 最近 12 周 (84 天), 每格一天. 周日到周六
  const today = new Date();
  const days = 84;
  const counts = {}; // 'YYYY-MM-DD' -> count
  // 计算发文日期 (取 posts 的日期 - 如果没有就用 link 末尾日期 fallback)
  for (const p of (stu.posts || [])) {
    let d = p.pubDate || '';
    // pubDate 可能是空, 用 link 中的 /details/XXXXXX 提取
    if (!d && p.link) {
      // 没真实日期就放 latest post 那天
      d = (stu.latest_post && stu.latest_post.link === p.link)
        ? today.toISOString().slice(0, 10)
        : '';
    }
    if (d && d.length >= 10) counts[d.slice(0, 10)] = (counts[d.slice(0, 10)] || 0) + 1;
  }

  // 构造 12 周 x 7 天 网格, 从最早的周日到 today
  const start = new Date(today);
  start.setDate(start.getDate() - (days - 1));
  // 调整到周日
  const dayOfWeek = start.getDay();
  start.setDate(start.getDate() - dayOfWeek);

  const cells = [];
  let cursor = new Date(start);
  for (let i = 0; i < days + 7; i++) {
    if (cursor > today) break;
    const ds = cursor.toISOString().slice(0, 10);
    const cnt = counts[ds] || 0;
    cells.push({ date: ds, count: cnt });
    cursor.setDate(cursor.getDate() + 1);
  }

  const colorOf = c => {
    if (c === 0) return 'var(--border-soft)';
    if (c === 1) return '#C5D4E8';
    if (c === 2) return '#9DB7D4';
    if (c <= 4) return '#5C7DA6';
    return '#1B365D';
  };

  // 构造网格: 7 行 (周日..周六), 列由 grid-auto-flow: column 自动
  const cellsHtml = cells.map(c =>
    `<div class="heat-cell" style="background:${colorOf(c.count)}"
         title="${escapeHtml(c.date)} · ${c.count} 篇"></div>`
  ).join('');

  return `
    <div class="heat-wrap">
      <div style="display:flex;gap:14px;font-size:10px;color:var(--stone);margin-bottom:6px;font-family:ui-monospace,monospace;">
        <span>周日</span><span style="visibility:hidden">一</span>
        <span>周一</span><span style="visibility:hidden">二</span>
        <span>周二</span><span style="visibility:hidden">三</span>
        <span>周三</span><span style="visibility:hidden">四</span>
        <span>周四</span><span style="visibility:hidden">五</span>
        <span>周五</span><span style="visibility:hidden">六</span>
        <span>周六</span>
      </div>
      <div class="heat-grid">${cellsHtml}</div>
      <div class="heat-meta">
        <span>少</span>
        <span class="swatch" style="background:#C5D4E8;"></span>
        <span class="swatch" style="background:#9DB7D4;"></span>
        <span class="swatch" style="background:#5C7DA6;"></span>
        <span class="swatch" style="background:#1B365D;"></span>
        <span>多</span>
        <span style="margin-left:auto;">共 ${cells.length} 天</span>
      </div>
    </div>
  `;
}

function renderPosts(stu) {
  const posts = (stu.posts || []).slice();
  // 按 total_views 降序 (没有此字段的排最后)
  posts.sort((a, b) => (b.total_views || 0) - (a.total_views || 0));

  if (posts.length === 0) {
    return '<div class="empty-state">暂无文章</div>';
  }

  const rows = posts.map((p, i) => {
    const ts = p.pubDate || (p.guid ? p.guid.slice(-10) : '—');
    return `<tr>
      <td>${i + 1}</td>
      <td class="ttl"><a href="${escapeHtml(p.link || '#')}" target="_blank" rel="noopener">${escapeHtml(p.title || '(无标题)')}</a></td>
      <td class="num read">${fmt(p.total_views)}</td>
      <td class="num">${fmt(p.total_likes)}</td>
      <td class="num">${fmt(p.total_comments)}</td>
      <td class="num">${fmt(p.total_collections)}</td>
      <td class="ts">${escapeHtml(ts)}</td>
    </tr>`;
  }).join('');

  return `
    <table class="posts">
      <thead><tr>
        <th>#</th><th>标题</th>
        <th style="text-align:right;">阅读</th>
        <th style="text-align:right;">点赞</th>
        <th style="text-align:right;">评论</th>
        <th style="text-align:right;">收藏</th>
        <th>抓取时间</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

  <script>
// apply_dark.js — content that should be appended before </body> of each HTML page
// Renders the dark toggle button and applies theme from localStorage
(function() {
    const DARK_KEY = 'csdn-dashboard-dark';
    function applyDark(on) {
      document.documentElement.classList.toggle('dark', on);
      var btn = document.getElementById('dark-toggle');
      if (btn) btn.textContent = on ? '☀' : '🌙';
    }
    // Restore saved preference
    try {
      if (localStorage.getItem(DARK_KEY) === '1') applyDark(true);
    } catch (e) {}
    // Wait for DOM to be ready so toggle button exists
    document.addEventListener('DOMContentLoaded', function() {
      var btn = document.getElementById('dark-toggle');
      if (!btn) return;
      btn.addEventListener('click', function() {
        var isDark = !document.documentElement.classList.contains('dark');
        applyDark(isDark);
        try { localStorage.setItem(DARK_KEY, isDark ? '1' : '0'); } catch (e) {}
      });
    });
})();  </script>
